[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Keep this focused on real correctness issues (unused imports/vars, undefined
# names, import order) rather than a full stylistic rewrite of the codebase.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
