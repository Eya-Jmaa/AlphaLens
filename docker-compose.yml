services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finagent-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.3}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-2048}
      - DATABASE_URL=postgresql+asyncpg://finagent:finagent@postgres:5432/finagent
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FINANCIAL_DATA_API_KEY=${FINANCIAL_DATA_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-FinAgent Research Platform (contact@example.com)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - finagent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finagent-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - finagent-network

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: finagent-mcp-server
    ports:
      - "8100:8100"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FINANCIAL_DATA_API_KEY=${FINANCIAL_DATA_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-FinAgent Research Platform (contact@example.com)}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - finagent-network

  postgres:
    image: postgres:16-alpine
    container_name: finagent-postgres
    environment:
      - POSTGRES_USER=finagent
      - POSTGRES_PASSWORD=finagent
      - POSTGRES_DB=finagent
    ports:
      # Host 5434 (not 5432) - avoids clashing with a native/other local Postgres.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finagent -d finagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finagent-network

  redis:
    image: redis:7-alpine
    container_name: finagent-redis
    ports:
      # Host 6380 (not 6379) - avoids clashing with another local Redis container.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finagent-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finagent-qdrant
    ports:
      # Host 6334/6335 (not 6333/6334) - avoids clashing with another local Qdrant container.
      - "6334:6333"
      - "6335:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finagent-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  finagent-network:
    driver: bridge
