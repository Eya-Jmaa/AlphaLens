services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphalens-backend
    # API is reached via nginx on :8080 (/api, /health, /api/docs). Host :8000 is
    # not published so a leftover local uvicorn cannot block the stack.
    environment:
      - ENVIRONMENT=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.3}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-2048}
      # Docker UI is served on :8080; without this the browser blocks API calls (CORS).
      # JSON list (quoted) — pydantic-settings parses List[str] as JSON, not CSV.
      - 'BACKEND_CORS_ORIGINS=["http://localhost:8080","http://localhost:5173","http://localhost:3000","http://127.0.0.1:8080","http://127.0.0.1:5173"]'
      - DATABASE_URL=postgresql+asyncpg://alphalens:alphalens@postgres:5432/alphalens
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FINANCIAL_DATA_API_KEY=${FINANCIAL_DATA_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-AlphaLens Research Platform (contact@example.com)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    networks:
      - alphalens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: alphalens-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alphalens-network

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: alphalens-mcp-server
    ports:
      - "8100:8100"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FINANCIAL_DATA_API_KEY=${FINANCIAL_DATA_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - SEC_USER_AGENT=${SEC_USER_AGENT:-AlphaLens Research Platform (contact@example.com)}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - alphalens-network

  postgres:
    image: postgres:16-alpine
    container_name: alphalens-postgres
    environment:
      - POSTGRES_USER=alphalens
      - POSTGRES_PASSWORD=alphalens
      - POSTGRES_DB=alphalens
    ports:
      # Host 5434 (not 5432) - avoids clashing with a native/other local Postgres.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphalens -d alphalens"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphalens-network

  redis:
    image: redis:7-alpine
    container_name: alphalens-redis
    ports:
      # Host 6380 (not 6379) - avoids clashing with another local Redis container.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphalens-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: alphalens-qdrant
    ports:
      # Host 6334/6335 (not 6333/6334) - avoids clashing with another local Qdrant container.
      - "6334:6333"
      - "6335:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphalens-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  alphalens-network:
    driver: bridge
